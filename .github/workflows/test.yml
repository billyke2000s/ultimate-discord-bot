name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build Lavalink loudness plugin image
        run: docker build --progress=plain -t lavalink-loudness-test -f lavalink/Dockerfile lavalink
      - name: Verify Lavalink loads the loudness plugin
        run: |
          docker run -d --name lavalink-loudness-test -p 127.0.0.1:2333:2333 \
            -e LAVALINK_SERVER_PASSWORD=ci-loudness lavalink-loudness-test
          trap 'docker logs lavalink-loudness-test; docker rm -f lavalink-loudness-test' EXIT
          curl --silent --show-error --fail --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 \
            -H 'Authorization: ci-loudness' http://127.0.0.1:2333/v4/info |
            jq -e '.plugins | any(.name == "obskyra-loudness")'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash scripts/build-installer.sh && bash -n dist/install.sh
