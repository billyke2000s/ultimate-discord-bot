# Every push to main: GitHub builds the bot's ready-made image (for normal and ARM servers), publishes it to
# this repo's package page, then builds install.sh pointing at that exact image and attaches it to a new Release.
name: Build and release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # create the Release with install.sh
  packages: write   # publish the image to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the "what's new" list

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regression tests
        run: |
          npm ci
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Image name (ghcr.io/<owner>/<repo>, lowercase)
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Titles of the pull requests merged since the previous release. Shown in Discord when music
      # resumes after an update, and in the release notes.
      - name: What's new since the last release
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=""
          if gh release download --pattern update.json --output "$RUNNER_TEMP/previous.json" 2>/dev/null; then
            prev=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("commit", ""))' "$RUNNER_TEMP/previous.json")
          fi
          echo "json=$(python3 scripts/release-notes.py "$prev")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the bot image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.name.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_NOTES=${{ steps.notes.outputs.json }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build install.sh (pinned to the exact image just built)
        run: bash scripts/build-installer.sh "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" dist/install.sh

      - name: Prepare the pinned YouTube plugin for the release image
        run: |
          source <(sed -n '/^PLUGIN_VERSION=/p; /^PLUGIN_SHA256=/p; /^PLUGIN_URL=/p' installer/install-head.sh)
          curl -fsSL --retry 3 "$PLUGIN_URL" -o "$RUNNER_TEMP/youtube.jar"
          echo "$PLUGIN_SHA256  $RUNNER_TEMP/youtube.jar" | sha256sum -c -
          python3 - "$RUNNER_TEMP/youtube.jar" <<'PY'
          import base64, pathlib, sys, zipfile
          configs = list(pathlib.Path('tools').glob('Tv-*-patched.class.b64'))
          assert len(configs) == 1
          patch = base64.b64decode(configs[0].read_text())
          target = 'dev/lavalink/youtube/clients/Tv.class'
          with zipfile.ZipFile(sys.argv[1]) as source:
              assert target in source.namelist()
              with zipfile.ZipFile('lavalink/release-youtube.jar', 'w', zipfile.ZIP_DEFLATED) as output:
                  for entry in source.infolist():
                      output.writestr(entry, patch if entry.filename == target else source.read(entry.filename))
          PY
          cp lavalink/Dockerfile lavalink/Dockerfile.release
          printf '\nCOPY release-youtube.jar /opt/Lavalink/plugins/youtube-source.jar\n' >> lavalink/Dockerfile.release

      - name: Publish the complete Lavalink image
        id: lavalink
        uses: docker/build-push-action@v6
        with:
          context: ./lavalink
          file: ./lavalink/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}-lavalink:sha-${{ github.sha }}
          cache-from: type=gha,scope=lavalink
          cache-to: type=gha,mode=max,scope=lavalink

      - name: Check install.sh
        run: bash -n dist/install.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_RELEASE_IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          LAVALINK_RELEASE_IMAGE: ${{ steps.name.outputs.image }}-lavalink@${{ steps.lavalink.outputs.digest }}
          NOTES_JSON: ${{ steps.notes.outputs.json }}
        run: |
          tag="${{ steps.name.outputs.version }}"
          export RELEASE_TAG="$tag"
          python3 - <<'PY'
          import json, os, pathlib, re
          env = os.environ
          installer = pathlib.Path('installer/install-head.sh').read_text()
          cipher = re.search(r'^CIPHER_IMAGE="([^"]+)"$', installer, re.M)[1]
          compose = pathlib.Path('docker-compose.yml').read_text()
          compose, count = re.subn(r'(?m)^(    image: )server-bot-lavalink-loudness:local$', lambda m: m[1] + env['LAVALINK_RELEASE_IMAGE'], compose)
          assert count == 1
          compose, count = re.subn(r'(?m)^      - \./lavalink/plugins/[^\n]+\n', '', compose)
          assert count == 1
          manifest = dict(repository=env['GITHUB_REPOSITORY'], tag=env['RELEASE_TAG'], commit=env['GITHUB_SHA'],
                          image=env['BOT_RELEASE_IMAGE'], deployment=2, lavalink=env['LAVALINK_RELEASE_IMAGE'],
                          cipher=cipher, compose=compose, application=pathlib.Path('lavalink/application.yml').read_text())
          pathlib.Path('dist/update.json').write_text(json.dumps(manifest))
          PY
          # Notes go through a file, never the shell, since PR titles can contain any characters.
          python3 -c 'import json,os; notes=json.loads(os.environ.get("NOTES_JSON") or "[]"); open("dist/notes.md","w").write(("## What'"'"'s new\n" + "".join("- %s\n" % n for n in notes) + "\n" if notes else "") + "**Already installed?** Run `/update` in Discord as the server owner. It updates the bot and Lavalink together.\n\n**First install or older update worker?** Use the attached `install.sh` for a fresh setup or if `/update` explicitly asks you to upgrade the VPS update worker.\n")'
          gh release create "$tag" dist/install.sh dist/update.json \
            --title "$tag" \
            --notes-file dist/notes.md \
            --latest

